name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # isolated-vm requires it on Node >= 20.
  NODE_OPTIONS: --no-node-snapshot

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # isolated-vm ships prebuilds for linux x64/arm64 (glibc + musl) and darwin arm64.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        node: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install bubblewrap (worker OS-sandbox test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r --workspace-concurrency=1 test

      - name: Package lint (publint + attw)
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 26
        run: pnpm lint:pkg

      - name: 'Smoke: build + publish the example theme with the CLI'
        run: pnpm --filter theme release

      - name: 'Smoke: production build of the example Next app'
        run: pnpm --filter host build

      - name: Docs build
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 26
        run: pnpm docs:build

  docs-adr:
    # Every change records its decisions; code changes also update the docs
    # (scripts/check-docs-adr.mjs, see apps/docs/content/docs/contributing/enforcement.mdx).
    name: docs and decision records
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check docs and ADR changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/check-docs-adr.mjs --base "$BASE"
